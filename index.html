<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Monroe Staff Dashboard</title>
<meta name="description" content="What's next at Grace Monroe: Sundays, the weekly rhythm, churchwide moments, and the Bold Springs Campaign.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Sanchez&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#now" aria-label="Grace Monroe staff dashboard">
      <!-- Approximation of the two-triangle mark from the brand deck; replace with the official SVG. -->
      <svg viewBox="0 0 100 86" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 80 L33 8 L60 80 Z"/><path d="M36 80 L64 8 L94 80 Z"/><path d="M82 62 H66" stroke-width="5"/>
      </svg>
      <span class="wordmark">Grace Monroe</span>
    </a>
    <nav aria-label="Sections">
      <a href="#now">Now</a><a href="#rhythm">Week</a><a href="#moments">Moments</a><a href="#campaign">Campaign</a>
    </nav>
    <button id="theme" class="btn" aria-label="Toggle light and dark mode">◐</button>
  </div>
</header>

<main>
  <section id="now" class="wrap hero"></section>
  <section id="rhythm" class="wrap block"></section>
  <section id="moments" class="wrap block"></section>
  <section id="campaign" class="band"><div class="wrap" id="camp"></div></section>
</main>

<footer class="wrap">
  <div id="links" class="links"></div>
  <p id="foot"></p>
</footer>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet"><button class="x" id="mx" aria-label="Close">×</button><div id="mbody"></div></div>
</div>

<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
