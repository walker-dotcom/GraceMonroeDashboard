<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Monroe Staff Dashboard</title>
<meta name="description" content="Staff view: calendar, giving, attendance, birthdays, Divvy reminders, the Sunday word, Bold Springs Campaign and PTO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Sanchez&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2b134">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GM Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!--/pwa-->
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <svg class="gate-mark" viewBox="0 0 100 86" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M8 6 L92 43 L8 80 Z"/><path d="M8 22 L70 43 L8 64 Z"/><path d="M8 36 L44 43 L8 50 Z"/></svg>
    <div class="label muted">Grace Monroe</div>
    <h1 id="g-title">Staff sign-in</h1>
    <p id="g-msg" class="muted">Checking your account.</p>
    <div id="g-actions"></div>
  </div>
</div>

<div id="app" hidden>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#today" aria-label="Grace Monroe staff dashboard">
      <svg viewBox="0 0 100 86" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 6 L92 43 L8 80 Z"/><path d="M8 22 L70 43 L8 64 Z"/><path d="M8 36 L44 43 L8 50 Z"/>
      </svg>
      <span class="wordmark">Grace Monroe</span>
    </a>
    <button id="avatar" class="avatar" type="button" aria-label="Account and settings">G</button>
    <button id="signout" class="btn ghost" aria-label="Sign out">Sign out</button>
    <button id="theme" class="btn ghost" aria-label="Toggle light and dark mode">Light / Dark</button>
  </div>
</header>

<main>
  <section id="today" class="wrap hero"></section>
  <section id="tiles" class="wrap tiles" aria-label="Dashboard"></section>
  <section id="ask" class="wrap ask" hidden></section>
</main>

<footer class="wrap">
  <p id="foot" class="cap"></p>
</footer>

<nav id="tabbar" class="tabbar" aria-label="Main"></nav>

<div id="statusbar" class="statusbar" role="status">
  <button id="srcs" class="sb-l" type="button" aria-label="Data sources"><i class="dotl" aria-hidden="true"></i><span id="sb-text">Saved copy</span></button>
  <button id="refresh" class="btn ghost" type="button">Refresh</button>
</div>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet"><button class="x" id="mx" aria-label="Close">Close</button><div id="mbody"></div></div>
</div>


<script src="data/data.js"></script>
<script src="app.js"></script>
<script src="ask.js"></script>
<script src="gate.js"></script>
<!--pwa-->
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});</script>
<!--/pwa-->
</body>
</html>
