<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Monroe Staff Dashboard</title>
<meta name="description" content="Staff view: calendar, giving, attendance, birthdays, Divvy reminders, the Sunday word, Bold Springs Campaign and PTO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Sanchez&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#today" aria-label="Grace Monroe staff dashboard">
      <svg viewBox="0 0 100 86" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 6 L92 43 L8 80 Z"/><path d="M8 22 L70 43 L8 64 Z"/><path d="M8 36 L44 43 L8 50 Z"/>
      </svg>
      <span class="wordmark">Grace Monroe</span>
    </a>
    <button id="theme" class="btn ghost" aria-label="Toggle light and dark mode">Light / Dark</button>
  </div>
</header>

<main>
  <section id="today" class="wrap hero"></section>
  <section id="tiles" class="wrap tiles" aria-label="Dashboard"></section>
</main>

<footer class="wrap">
  <div id="links" class="links"></div>
  <p id="foot" class="cap"></p>
</footer>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet"><button class="x" id="mx" aria-label="Close">Close</button><div id="mbody"></div></div>
</div>

<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
